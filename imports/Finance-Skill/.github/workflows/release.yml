name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build skill packages
        run: |
          set -e
          mkdir -p release

          # 为每个 skill 单独打 zip
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            echo "Packaging $skill_name..."
            (cd skills && zip -rq "../release/${skill_name}.zip" "$skill_name")
          done

          # 打总包(包含所有 skills + LICENSE + README + install.sh)
          echo "Packaging finance-skill-all..."
          mkdir -p release/_staging/finance-skill-all
          cp -r skills release/_staging/finance-skill-all/
          cp install.sh LICENSE README.md CHANGELOG.md CONTRIBUTING.md release/_staging/finance-skill-all/
          (cd release/_staging && zip -rq "../finance-skill-all.zip" finance-skill-all)
          rm -rf release/_staging

          echo ""
          echo "Built artifacts:"
          ls -lh release/

      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> $GITHUB_OUTPUT

          # 从 CHANGELOG 抽取本版本的 notes
          if [ -f CHANGELOG.md ]; then
            python3 << EOF > release_notes.md
          import re
          tag = "$tag".lstrip("v")
          content = open("CHANGELOG.md").read()
          # 匹配 "## [tag]" 到下一个 "## [" 之间的内容
          pattern = rf"## \[{re.escape(tag)}\].*?\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, content, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              print(f"Release {tag}")
              print()
              print("See CHANGELOG.md for details.")
          EOF
          else
            echo "Release $tag" > release_notes.md
          fi

          echo "─── Release notes ───"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            release/*.zip
          draft: false
          prerelease: false
