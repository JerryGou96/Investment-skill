name: Lint Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate skills structure
        run: |
          python3 << 'EOF'
          import os
          import re
          import sys
          import yaml
          from pathlib import Path

          SKILLS_DIR = Path("skills")
          errors = []
          warnings = []

          if not SKILLS_DIR.is_dir():
              print(f"❌ skills/ directory not found")
              sys.exit(1)

          skill_dirs = sorted(p for p in SKILLS_DIR.iterdir() if p.is_dir())
          if not skill_dirs:
              print(f"❌ No skills found in skills/")
              sys.exit(1)

          print(f"Found {len(skill_dirs)} skill(s):")
          for d in skill_dirs:
              print(f"  - {d.name}")
          print()

          for skill_dir in skill_dirs:
              folder_name = skill_dir.name
              print(f"Checking {folder_name}...")

              # Rule 1: SKILL.md must exist
              skill_md = skill_dir / "SKILL.md"
              if not skill_md.is_file():
                  errors.append(f"{folder_name}: missing SKILL.md")
                  continue

              content = skill_md.read_text(encoding="utf-8")

              # Rule 2: must have YAML frontmatter
              fm_match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
              if not fm_match:
                  errors.append(f"{folder_name}/SKILL.md: missing YAML frontmatter (--- ... ---)")
                  continue

              # Rule 3: parse frontmatter
              try:
                  fm = yaml.safe_load(fm_match.group(1))
              except yaml.YAMLError as e:
                  errors.append(f"{folder_name}/SKILL.md: invalid YAML frontmatter — {e}")
                  continue

              if not isinstance(fm, dict):
                  errors.append(f"{folder_name}/SKILL.md: frontmatter is not a dict")
                  continue

              # Rule 4: must have name and description
              if "name" not in fm:
                  errors.append(f"{folder_name}/SKILL.md: frontmatter missing 'name'")
              if "description" not in fm:
                  errors.append(f"{folder_name}/SKILL.md: frontmatter missing 'description'")

              # Rule 5: name must match folder name
              if fm.get("name") and fm["name"] != folder_name:
                  errors.append(
                      f"{folder_name}/SKILL.md: frontmatter name='{fm['name']}' "
                      f"does not match folder name='{folder_name}'"
                  )

              # Rule 6: description should not be too short
              desc = fm.get("description", "")
              if desc and len(desc) < 30:
                  warnings.append(
                      f"{folder_name}/SKILL.md: description is very short ({len(desc)} chars), "
                      f"consider adding trigger keywords"
                  )

              # Rule 7: no leftover placeholders in any file
              for fpath in skill_dir.rglob("*"):
                  if fpath.is_file() and fpath.suffix in (".md", ".sh", ".yml", ".yaml"):
                      text = fpath.read_text(encoding="utf-8", errors="ignore")
                      for placeholder in ["<your-username>", "<your-name>", "TODO_FILL_IN", "占位符未替换"]:
                          if placeholder in text:
                              errors.append(
                                  f"{fpath.relative_to('.')}: contains leftover placeholder '{placeholder}'"
                              )

              print(f"  ✅ {folder_name}")

          print()
          if warnings:
              print("⚠️  Warnings:")
              for w in warnings:
                  print(f"  - {w}")
              print()

          if errors:
              print("❌ Errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print("✅ All skills passed validation")
          EOF
